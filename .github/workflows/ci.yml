name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      run_evals:
        description: 'Run evaluation pipeline'
        required: false
        type: boolean
        default: false

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv pip install -e ".[dev]" --system
      - name: Lint with Ruff
        run: ruff check .
      - name: Type check with Mypy
        run: mypy .
      - name: Run Pytest
        run: pytest

  evals:
    if: github.event.inputs.run_evals == 'true'
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Evaluators
        run: |
          echo "Running evals..."
          python evals/run_eval.py --mode vector_only
          python evals/run_eval.py --mode hybrid_rerank
          python evals/ci_gate.py
