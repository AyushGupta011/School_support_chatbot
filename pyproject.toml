[project]
name = "school-support-chatbot"
version = "0.1.0"
description = "University student assistant chatbot"
authors = [{name = "Ayush Gupta", email = "ayushshg4@gmail.com"}]
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn==0.30.6",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "sqlalchemy==2.0.35",
    "asyncpg>=0.30.0",
    "redis==5.0.8",
    "structlog==24.4.0",
    "alembic>=1.13.0",
    "pgvector>=0.2.0",
    "faker>=20.0.0",
    "langchain==0.3.0",
    "langchain-core==0.3.0",
    "langchain-community==0.3.0",
    "langgraph==0.2.20",
    "langchain-postgres==0.0.12",
    "langgraph-checkpoint-postgres==1.0.3",
    "ragas==0.1.16",
    "langsmith==0.1.125",
    "psycopg2-binary==2.9.9",
    "python-jose[cryptography]==3.3.0",
    "passlib[argon2]==1.7.4",
    "fake-useragent>=1.4.0",
    "langchain-openai>=0.0.8",
    "langchain-cohere>=0.0.3",
    "markdown>=3.5.0",
    "unstructured>=0.12.0",
    "pypdf>=4.0.0",
    "argon2-cffi>=23.0.0",
    "python-multipart>=0.0.9",
    "fakeredis>=2.21.3",
    "langchain-redis>=0.0.1",
    "sse-starlette>=2.0.0",
    "langsmith>=0.1.0",
    "redis>=5.0.0",
    "langgraph-checkpoint-postgres>=1.0.3",
    "langchain-google-genai>=1.0.0",
    "langchain-groq>=0.1.0",
    "langchain-nvidia-ai-endpoints>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "httpx==0.27.2",
    "httpx-sse>=0.4.0",
    "ruff==0.6.8",
    "mypy==1.11.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["B008", "DTZ003", "DTZ011"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
